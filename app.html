<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fish Audio TTS — 用户中心</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF8; --fg: #0A0A0A; --muted: #888888;
    --border: #E8E8E8; --surface: #F5F5F2; --white: #FFFFFF;
    --radius-lg: 28px; --radius-full: 999px;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Plus Jakarta Sans', -apple-system, sans-serif;
    background:var(--bg); color:var(--fg);
    -webkit-font-smoothing:antialiased; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow-x:hidden;
  }
  .card {
    position:relative; z-index:1; width:420px; max-width:92vw;
    background:var(--white); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:48px 40px;
    box-shadow:0 1px 2px rgba(0,0,0,0.02), 0 12px 40px rgba(0,0,0,0.05);
    transition:box-shadow 0.5s;
  }
  .card:hover { box-shadow:0 1px 2px rgba(0,0,0,0.03), 0 20px 60px rgba(0,0,0,0.08); }
  .logo { width:48px; height:48px; border:2px solid var(--fg); border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-size:22px; font-weight:700; font-style:italic; margin-bottom:32px; color:var(--fg); }
  .tabs { display:flex; gap:4px; background:var(--surface); border-radius:var(--radius-full); padding:4px; margin-bottom:36px; }
  .tab { flex:1; text-align:center; padding:12px; border-radius:var(--radius-full); font-size:13px; font-weight:600; cursor:pointer; color:var(--muted); border:none; background:none; font-family:inherit; }
  .tab.active { background:var(--white); color:var(--fg); box-shadow:0 2px 8px rgba(0,0,0,0.08); }
  .form { display:none; }
  .form.active { display:block; }
  .field { margin-bottom:20px; }
  .field label { display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin-bottom:8px; }
  .input-pill { display:flex; background:var(--surface); border-radius:var(--radius-full); border:1.5px solid transparent; transition:all 0.3s; }
  .field:focus-within .input-pill { border-color:rgba(0,0,0,0.12); background:var(--white); box-shadow:0 0 0 4px rgba(0,0,0,0.04); }
  .input-pill input { flex:1; background:transparent; border:none; outline:none; padding:14px 18px; font-size:14px; font-family:inherit; color:var(--fg); }
  .input-pill input::placeholder { color:#C0C0BA; }
  .error-msg { font-size:11px; color:#D32F2F; margin-top:6px; display:none; }
  .btn { width:100%; font-family:'Syne',sans-serif; font-size:14px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; padding:16px; border-radius:var(--radius-full); cursor:pointer; border:2px solid var(--fg); margin-top:8px; background:var(--fg); color:var(--bg); }
  .btn:hover { background:var(--bg); color:var(--fg); }
  .btn:disabled { opacity:0.6; cursor:not-allowed; }
  .dashboard { display:none; }
  .dashboard.active { display:block; }
  .user-header { display:flex; align-items:center; gap:16px; margin-bottom:36px; }
  .avatar { width:56px; height:56px; border-radius:50%; background:var(--fg); color:var(--bg); display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-size:24px; font-weight:700; }
  .user-info h2 { font-family:'Syne',sans-serif; font-size:22px; font-weight:700; margin-bottom:4px; }
  .user-info p { font-size:13px; color:var(--muted); }
  .menu-item { display:flex; align-items:center; gap:12px; padding:16px 20px; border-radius:18px; cursor:pointer; transition:background 0.3s; margin-bottom:4px; font-size:14px; font-weight:500; }
  .menu-item:hover { background:var(--surface); }
  .profile-form { display:none; margin-top:24px; }
  .profile-form.active { display:block; }
  .divider-text { text-align:center; font-size:11px; color:var(--muted); margin:20px 0; }
  .toast { position:fixed; bottom:36px; left:50%; transform:translateX(-50%) translateY(120px); background:var(--fg); color:var(--bg); padding:14px 28px; border-radius:var(--radius-full); font-size:13px; font-weight:500; z-index:100; opacity:0; transition:all 0.5s; pointer-events:none; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.error { background:#D32F2F; }
  .toast.success { background:#1B5E20; }
  @media(max-width:500px){ .card{padding:36px 24px;} .user-header{flex-direction:column;text-align:center;} }
</style>
</head>
<body>

<main class="card" id="mainCard">
  <div class="logo" id="logo">W</div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-form="login">登录</button>
    <button class="tab" data-form="register">注册</button>
  </div>

  <!-- LOGIN -->
  <form class="form active" id="loginForm" onsubmit="return false">
    <div class="field">
      <label>邮箱</label>
      <div class="input-pill"><input type="email" id="loginEmail" placeholder="输入邮箱地址" autocomplete="email"></div>
      <div class="error-msg" id="loginEmailErr"></div>
    </div>
    <div class="field">
      <label>密码</label>
      <div class="input-pill"><input type="password" id="loginPassword" placeholder="输入密码" autocomplete="current-password"></div>
      <div class="error-msg" id="loginPasswordErr"></div>
    </div>
    <button class="btn" id="loginBtn" onclick="handleLogin()">登 录</button>
  </form>

  <!-- REGISTER -->
  <form class="form" id="registerForm" onsubmit="return false">
    <div class="field">
      <label>邮箱</label>
      <div class="input-pill"><input type="email" id="regEmail" placeholder="输入邮箱地址"></div>
      <div class="error-msg" id="regEmailErr"></div>
    </div>
    <div class="field">
      <label>密码</label>
      <div class="input-pill"><input type="password" id="regPassword" placeholder="至少 6 位字符" minlength="6"></div>
      <div class="error-msg" id="regPasswordErr"></div>
    </div>
    <div class="field">
      <label>昵称</label>
      <div class="input-pill"><input type="text" id="regNickname" placeholder="你的昵称" maxlength="30"></div>
    </div>
    <button class="btn" id="regBtn" onclick="handleRegister()">注 册</button>
  </form>

  <!-- DASHBOARD -->
  <div class="dashboard" id="dashboard">
    <div class="user-header">
      <div class="avatar" id="avatar">W</div>
      <div class="user-info">
        <h2 id="displayName">用户</h2>
        <p id="displayEmail">user@example.com</p>
      </div>
    </div>
    <div class="menu-item" onclick="toggleProfile()">✏️ 编辑个人资料</div>
    <div class="menu-item" onclick="location.href='index.html'">🏠 返回首页</div>
    <div class="menu-item" onclick="handleLogout()">🚪 退出登录</div>
    <div class="profile-form" id="profileForm">
      <div class="divider-text">编辑资料</div>
      <div class="field">
        <label>昵称</label>
        <div class="input-pill"><input type="text" id="editNickname" placeholder="新昵称" maxlength="30"></div>
      </div>
      <button class="btn" onclick="handleUpdateProfile()">保存修改</button>
      <p style="text-align:center;margin-top:12px;font-size:12px;color:var(--muted);cursor:pointer;" onclick="toggleProfile()">取消</p>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  // ═══ Show loading feedback ═══
  var toastTimer;
  function toast(msg, type) {
    clearTimeout(toastTimer);
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type || '');
    t.classList.add('show');
    toastTimer = setTimeout(function() { t.classList.remove('show'); }, 3000);
  }

  // ═══ Load Supabase SDK with fallback ═══
  function initApp() {
    if (typeof window.supabase === 'undefined') {
      toast('正在加载…', '');
      setTimeout(initApp, 500);
      return;
    }
    main();
  }

  function main() {
    var supabase = window.supabase.createClient(
      'https://aarflekuewppseizlcyw.supabase.co',
      'sb_publishable_rTCqG85lF-jYxTeP8q5e6A_IEtRdXTa'
    );

    // Elements
    var tabs = document.getElementById('tabs');
    var logo = document.getElementById('logo');
    var loginForm = document.getElementById('loginForm');
    var registerForm = document.getElementById('registerForm');
    var dashboard = document.getElementById('dashboard');
    var profileForm = document.getElementById('profileForm');

    // Tab switching
    document.querySelectorAll('.tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        this.classList.add('active');
        var id = this.dataset.form;
        loginForm.classList.toggle('active', id === 'login');
        registerForm.classList.toggle('active', id === 'register');
        dashboard.classList.remove('active');
        tabs.style.display = 'flex';
      });
    });

    function validateEmail(email) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }
    function showErr(id, msg) { var el = document.getElementById(id); el.textContent = msg; el.style.display = msg ? 'block' : 'none'; }
    function clearErrs() { ['loginEmailErr','loginPasswordErr','regEmailErr','regPasswordErr'].forEach(function(id) { showErr(id, ''); }); }

    function showDashboard(user) {
      loginForm.classList.remove('active');
      registerForm.classList.remove('active');
      dashboard.classList.add('active');
      tabs.style.display = 'none';
      var name = (user.user_metadata && user.user_metadata.nickname) || (user.email || '').split('@')[0] || '用户';
      document.getElementById('displayName').textContent = name;
      document.getElementById('displayEmail').textContent = user.email || '';
      document.getElementById('avatar').textContent = (name[0] || 'W').toUpperCase();
      document.getElementById('editNickname').value = (user.user_metadata && user.user_metadata.nickname) || '';
    }

    // Check session
    supabase.auth.getSession().then(function(r) {
      if (r.data && r.data.session && r.data.session.user) showDashboard(r.data.session.user);
    }).catch(function(e) { console.log('session error:', e); });

    // Auth state change
    supabase.auth.onAuthStateChange(function(event, session) {
      if (session && session.user) showDashboard(session.user);
    });

    // ═══ Login ═══
    window.handleLogin = async function() {
      clearErrs();
      var email = document.getElementById('loginEmail').value.trim();
      var pass = document.getElementById('loginPassword').value;
      var ok = true;
      if (!email) { showErr('loginEmailErr', '请输入邮箱'); ok = false; }
      else if (!validateEmail(email)) { showErr('loginEmailErr', '邮箱格式不正确'); ok = false; }
      if (!pass) { showErr('loginPasswordErr', '请输入密码'); ok = false; }
      if (!ok) return;

      var btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = '登录中…';

      try {
        var r = await supabase.auth.signInWithPassword({ email: email, password: pass });
        btn.disabled = false; btn.textContent = '登 录';
        if (r.error) {
          toast(r.error.message || '登录失败', 'error');
        } else if (r.data && r.data.user) {
          toast('登录成功', 'success');
          showDashboard(r.data.user);
        }
      } catch(e) {
        btn.disabled = false; btn.textContent = '登 录';
        toast('请求失败: ' + e.message, 'error');
      }
    };

    // ═══ Register ═══
    window.handleRegister = async function() {
      clearErrs();
      var email = document.getElementById('regEmail').value.trim();
      var pass = document.getElementById('regPassword').value;
      var nick = document.getElementById('regNickname').value.trim();
      var ok = true;
      if (!email) { showErr('regEmailErr', '请输入邮箱'); ok = false; }
      else if (!validateEmail(email)) { showErr('regEmailErr', '邮箱格式不正确'); ok = false; }
      if (!pass) { showErr('regPasswordErr', '请输入密码'); ok = false; }
      else if (pass.length < 6) { showErr('regPasswordErr', '密码至少 6 位'); ok = false; }
      if (!ok) return;

      var btn = document.getElementById('regBtn');
      btn.disabled = true; btn.textContent = '注册中…';

      try {
        var r = await supabase.auth.signUp({
          email: email,
          password: pass,
          options: { data: { nickname: nick || email.split('@')[0] } }
        });
        btn.disabled = false; btn.textContent = '注 册';
        if (r.error) {
          toast(r.error.message || '注册失败', 'error');
        } else if (r.data && r.data.user) {
          if (r.data.session) {
            toast('注册成功！', 'success');
          } else {
            toast('注册成功！', 'success');
            document.querySelector('.tab[data-form="login"]').click();
          }
        }
      } catch(e) {
        btn.disabled = false; btn.textContent = '注 册';
        toast('请求失败: ' + e.message, 'error');
      }
    };

    // ═══ Logout ═══
    window.handleLogout = async function() {
      await supabase.auth.signOut();
      dashboard.classList.remove('active');
      tabs.style.display = 'flex';
      document.querySelector('.tab[data-form="login"]').click();
      document.getElementById('loginEmail').value = '';
      document.getElementById('loginPassword').value = '';
      toast('已退出登录', 'success');
    };

    // ═══ Profile ═══
    window.toggleProfile = function() { profileForm.classList.toggle('active'); };
    window.handleUpdateProfile = async function() {
      var nick = document.getElementById('editNickname').value.trim();
      if (!nick) { toast('请输入昵称', 'error'); return; }
      try {
        var r = await supabase.auth.updateUser({ data: { nickname: nick } });
        if (r.error) { toast(r.error.message, 'error'); return; }
        document.getElementById('displayName').textContent = nick;
        document.getElementById('avatar').textContent = nick[0].toUpperCase();
        profileForm.classList.remove('active');
        toast('资料已更新', 'success');
      } catch(e) { toast('更新失败: ' + e.message, 'error'); }
    };

    // Enter key
    document.querySelectorAll('input').forEach(function(inp) {
      inp.addEventListener('keydown', function(e) {
        if (e.key !== 'Enter') return;
        if (loginForm.classList.contains('active')) window.handleLogin();
        else if (registerForm.classList.contains('active')) window.handleRegister();
      });
    });

    toast(''); // init
  }

  // ═══ Load SDK then init ═══
  var s = document.createElement('script');
  s.src = 'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js';
  s.onload = function() { initApp(); };
  s.onerror = function() {
    // fallback to jsdelivr
    var s2 = document.createElement('script');
    s2.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
    s2.onload = function() { initApp(); };
    s2.onerror = function() { toast('SDK 加载失败，网络不通', 'error'); };
    document.head.appendChild(s2);
  };
  document.head.appendChild(s);
</script>

</body>
</html>
